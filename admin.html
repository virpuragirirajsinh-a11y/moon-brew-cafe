<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,
initial-scale=1.0">

<title>
Moon Brew Admin
</title>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet"
/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:
'Poppins',
sans-serif;
}

body{

background:
linear-gradient(
135deg,
#050505,
#0d0d0d
);

color:white;

display:flex;

min-height:100vh;

overflow:auto;
}

/* Sidebar */

.sidebar{

width:250px;

height:100vh;

background:
rgba(255,255,255,0.04);

backdrop-filter:
blur(25px);

border-right:
1px solid rgba(
255,255,255,0.08
);

padding:30px 20px;

display:flex;
flex-direction:column;
justify-content:space-between;
}

.logo{

text-align:center;
margin-bottom:35px;
}

.logo h1{

font-size:34px;
font-weight:700;

color:#ffd369;

line-height:1.1;
}

.logo p{

font-size:13px;
color:#777;

margin-top:8px;
}

.menu{

display:flex;
flex-direction:column;
gap:15px;
}

.menu button{

width:100%;

padding:16px 18px;

border:none;
outline:none;

border-radius:22px;

background:
rgba(255,255,255,0.04);

color:white;

font-size:16px;
font-weight:500;

cursor:pointer;

transition:0.35s;

display:flex;
align-items:center;
gap:12px;
}

.menu button:hover{

transform:
translateX(8px);

background:
rgba(255,255,255,0.09);

box-shadow:
0 10px 30px
rgba(255,211,105,0.08);
}

.products-grid{

display:grid;

grid-template-columns:
repeat(auto-fill,
minmax(280px,1fr));

gap:24px;

align-items:start;
}

/* Main */

.main{

flex:1;

padding:35px;

overflow-y:auto;
height: 100vh;
padding-bottom: 120px;
}

.header{

display:flex;
justify-content:
space-between;
align-items:center;

margin-bottom:30px;
}

.header h1{

font-size:48px;
font-weight:700;
}

.header p{

color:#888;
font-size:15px;
}

/* Stats */

.stats{

display:grid;

grid-template-columns:
repeat(4,1fr);

gap:18px;

margin-top:25px;
margin-bottom:35px;
}

.stat-card{

background:
linear-gradient(
145deg,
rgba(20,20,20,0.95),
rgba(10,10,10,0.95)
);

border:
1px solid rgba(
255,255,255,0.06
);

border-radius:26px;

padding:22px;

min-height:150px;

transition:0.35s;

position:relative;

overflow:hidden;

box-shadow:
0 8px 25px
rgba(0,0,0,0.45);

}

.stat-card:hover{

transform:
translateY(-6px);

border:
1px solid rgba(
255,211,105,0.15
);
}

.stat-card:hover{

transform:
translateY(-8px);
}

.stat-card h2{

font-size:38px;
font-weight:700;

color:white;

margin-bottom:12px;
}

.stat-card p{

font-size:14px;

color:#8f8f8f;

letter-spacing:0.5px;
}

.main{

background:
linear-gradient(
180deg,
#080808,
#050505
);

border-top-left-radius:
40px;
}
/* Sections */

.section{
display:none;
}

.section.active{
display:block;
}

</style>
</head>

<body>

<!-- Sidebar -->

<div class="sidebar">

<div>

<div class="logo">

<h1>
☕ Moon
<br>
Brew
</h1>

<p>
Luxury Admin Panel
</p>

</div>

<div class="menu">

<button
onclick="showSection('dashboard')">

📊 Dashboard

</button>

<button
onclick="showSection('orders')">

📦 Orders

</button>

<button
onclick="showSection('products')">

🛍 Products

</button>

<button
onclick="logout()">

🚪 Logout

</button>

</div>

</div>

</div>

<!-- Main -->

<div class="main">

<div class="header">

<div>

<h1>
✨ Dashboard
</h1>

<p>
Welcome Back, Admin
</p>

</div>

</div>

<!-- Dashboard -->

<div
id="dashboard"
class="section active">

<div class="stats">

<div class="stat-card">
<h2 id="total-orders">
0
</h2>

<p>
📦 Total Orders
</p>
</div>

<div class="stat-card">
<h2 id="total-revenue">
₹0
</h2>

<p>
💰 Revenue
</p>
</div>

<div class="stat-card">
<h2 id="top-product">
None
</h2>

<p>
🔥 Top Product
</p>
</div>

<div class="stat-card">
<h2 id="completed-orders">
0
</h2>

<p>
✅ Completed
</p>
</div>

</div>

</div>

<!-- Orders -->

<div
id="orders"
class="section">

<style>

.orders-grid{

display:grid;

grid-template-columns:
repeat(auto-fit,
minmax(340px,1fr));

gap:24px;
}

.order-card{

background:
linear-gradient(
145deg,
rgba(255,255,255,0.08),
rgba(255,255,255,0.03)
);

border:
1px solid rgba(
255,255,255,0.08
);

border-radius:35px;

padding:24px;

backdrop-filter:
blur(25px);

transition:0.35s;

box-shadow:
0 15px 40px
rgba(0,0,0,0.3);
}

.order-card:hover{

transform:
translateY(-8px);

}

.customer{

display:flex;
justify-content:
space-between;
align-items:center;

margin-bottom:18px;
}

.customer h2{

font-size:28px;
color:#ffd369;
}

.status{

padding:10px 18px;

border-radius:40px;

font-size:14px;
font-weight:600;
}

.pending{

background:
rgba(255,180,71,0.15);

color:#ffb347;
}

.completed{

background:
rgba(76,175,80,0.15);

color:#4CAF50;
}

.info{

line-height:2;
color:#ddd;
font-size:15px;
}

.order-items{

margin-top:18px;

padding:18px;

background:
rgba(255,255,255,0.05);

border-radius:24px;
}

.order-items h3{

margin-bottom:12px;
font-size:18px;
}

.total{

font-size:30px;
font-weight:700;

color:#ffd369;

margin-top:20px;
}

.action-buttons{

display:flex;
gap:12px;

margin-top:22px;
}

.done-btn{

flex:1;

padding:14px;

border:none;
border-radius:18px;

cursor:pointer;

font-size:15px;
font-weight:600;

background:
linear-gradient(
45deg,
#4CAF50,
#2E7D32
);

color:white;
}

.delete-btn{

flex:1;

padding:14px;

border:none;
border-radius:18px;

cursor:pointer;

font-size:15px;
font-weight:600;

background:
linear-gradient(
45deg,
#ff416c,
#ff4b2b
);

color:white;
}

</style>

<div
class="orders-grid"
id="orders-container">

</div>

</div>

<!-- Products -->

<div
id="products"
class="section">

<style>

.product-header{

display:flex;
justify-content:
space-between;
align-items:center;

margin-bottom:28px;
}

.product-header h2{

font-size:34px;
font-weight:700;
}

.product-layout{

display:grid;

grid-template-columns:
350px 1fr;

gap:28px;
}

.product-form{

background:
linear-gradient(
145deg,
rgba(255,255,255,0.08),
rgba(255,255,255,0.03)
);

border:
1px solid rgba(
255,255,255,0.08
);

padding:28px;

border-radius:35px;

backdrop-filter:
blur(25px);

position:sticky;
top:20px;

height:fit-content;
}

.product-form h3{

margin-bottom:20px;
font-size:24px;
}

.product-form input,
.product-form textarea{

width:100%;

padding:16px;

margin-bottom:16px;

border:none;
outline:none;

border-radius:18px;

background:
rgba(255,255,255,0.06);

color:white;

font-size:15px;
}

.product-form textarea{
height:110px;
resize:none;
}

.add-btn{

width:100%;
padding:16px;

border:none;
border-radius:20px;

cursor:pointer;

font-size:16px;
font-weight:600;

background:
linear-gradient(
45deg,
#ffd369,
#ffb347
);

color:#111;
}

.products-grid{

display:grid;

grid-template-columns:
repeat(auto-fill,
minmax(280px,1fr));

gap:24px;

align-items:start;
}

.product-card{

background:
linear-gradient(
145deg,
rgba(255,255,255,0.08),
rgba(255,255,255,0.03)
);

border:
1px solid rgba(
255,255,255,0.08
);

border-radius:32px;

padding:18px;

backdrop-filter:
blur(25px);

transition:0.35s;

height:420px;

display:flex;
flex-direction:column;
justify-content:space-between;
}

.product-card:hover{

transform:
translateY(-8px);
}

.product-card img{

width:100%;
height:180px;

object-fit:cover;

border-radius:24px;

margin-bottom:16px;
}

.product-card h2{

font-size:24px;
margin-bottom:8px;
}

.product-price{

font-size:28px;
font-weight:700;

color:#ffd369;

margin-bottom:12px;
}

.product-description{

font-size:14px;
line-height:1.8;

color:#bbb;
}

.product-delete{

width:100%;

margin-top:20px;

padding:14px;

border:none;
border-radius:18px;

cursor:pointer;

font-size:15px;
font-weight:600;

background:
linear-gradient(
45deg,
#ff416c,
#ff4b2b
);

color:white;
}

@media(max-width:900px){

.product-layout{

display:grid;

grid-template-columns:
350px 1fr;

gap:28px;

align-items:start;
}

.sidebar{
width:90px;
}

.logo p{
display:none;
}

.menu button{
font-size:13px;
padding:14px;
}

.header h1{

font-size:58px;
font-weight:700;

color:#f5f5f5;
}
}

</style>

<div class="product-header">

<h2>
🛍 Products
</h2>

</div>

<div class="product-layout">

<!-- Add Product -->

<div class="product-form">

<h3>
➕ Add Product
</h3>

<input
type="text"
id="product-name"
placeholder="Product Name"
>

<input
type="text"
id="product-price"
placeholder="Price ₹499"
>

<input
type="text"
id="product-image"
placeholder="Image URL"
>

<textarea
id="product-description"
placeholder="Description"
></textarea>

<button
class="add-btn"
onclick="addProduct()">

✨ Add Product

</button>

</div>

<!-- Products Grid -->

<div
class="products-grid"
id="products-container">

</div>

</div>

</div>

<script>

// Section Switch

function showSection(id){

document
.querySelectorAll(
".section"
)
.forEach(section => {

section.classList.remove(
"active"
);

});

document
.getElementById(id)
.classList.add(
"active"
);

}

// Logout

function logout(){

window.location.href =
"admin-login.html";

}

// Load Orders

async function loadOrders(){

const response =
await fetch(
"http://localhost:5000/messages"
);

const data =
await response.json();

const container =
document.getElementById(
"orders-container"
);

container.innerHTML = "";

document.getElementById(
"total-orders"
).innerText =
data.length;

let revenue = 0;
let completed = 0;
let products = {};

data.forEach(order => {

const total =
parseInt(
(order.total || "₹0")
.replace("₹","")
) || 0;

revenue += total;

if(
order.status ===
"Completed"
){
completed++;
}

if(order.items){

order.items.forEach(item=>{

products[item.name] =
(products[item.name] || 0)
+ item.quantity;

});

}

});

document.getElementById(
"total-revenue"
).innerText =
"₹" + revenue;

document.getElementById(
"completed-orders"
).innerText =
completed;

let top =
"None";
let max = 0;

for(let product in products){

if(products[product]
> max){

max =
products[product];

top =
product;

}

}

document.getElementById(
"top-product"
).innerText =
top;

// Render Orders

data.forEach(
(order,index)=>{

let itemsHTML = "";

if(order.items){

order.items.forEach(item=>{

itemsHTML += `

<p>
🍕 ${item.name}
x${item.quantity}
</p>

`;

});

}

container.innerHTML += `

<div class="order-card">

<div class="customer">

<h2>
${order.name}
</h2>

<div class="
status
${order.status ===
'Completed'
? 'completed'
: 'pending'}
">

${order.status ===
'Completed'
? '🟢 Completed'
: '🟠 Pending'}

</div>

</div>

<div class="info">

📱
${order.phone}

<br>

📍
${order.address}

</div>

<div class="order-items">

<h3>
🛒 Order Items
</h3>

${itemsHTML}

</div>

<div class="total">

💰
${order.total}

</div>

<div
class="action-buttons">

<button
class="done-btn"
onclick=
"markDone(${index})">

✅ Done

</button>

<button
class="delete-btn"
onclick=
"deleteOrder(${index})">

🗑 Delete

</button>

</div>

</div>

`;

});

}

// Mark Done

async function markDone(index){

await fetch(
`http://localhost:5000/order-done/${index}`,
{
method:"PUT"
}
);

loadOrders();

}

// Delete Order

async function deleteOrder(index){

await fetch(
`http://localhost:5000/delete/${index}`,
{
method:"DELETE"
}
);

loadOrders();

}

// Load Products

async function loadProducts(){

const response =
await fetch(
"http://localhost:5000/products"
);

const data =
await response.json();

const container =
document.getElementById(
"products-container"
);

container.innerHTML = "";

data.forEach(
(item,index)=>{

container.innerHTML += `

<div class="product-card">

<img src="${item.image}">

<h2>
${item.name}
</h2>

<div class="product-price">
💰 ${item.price}
</div>

<div class="
product-description">

${item.description}

</div>

<button
class="product-delete"
onclick=
"deleteProduct(${index})">

🗑 Delete

</button>

</div>

`;

});

}

// Add Product

async function addProduct(){

const data = {

name:
document.getElementById(
"product-name"
).value,

price:
document.getElementById(
"product-price"
).value,

image:
document.getElementById(
"product-image"
).value,

description:
document.getElementById(
"product-description"
).value

};

if(
!data.name ||
!data.price ||
!data.image
){

alert(
"Please Fill Details 😎"
);

return;

}

const response =
await fetch(
"http://localhost:5000/add-product",
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify(data)

});

const result =
await response.json();

alert(
result.message
);

document.getElementById(
"product-name"
).value = "";

document.getElementById(
"product-price"
).value = "";

document.getElementById(
"product-image"
).value = "";

document.getElementById(
"product-description"
).value = "";

loadProducts();

}

// Delete Product

async function deleteProduct(index){

await fetch(
`http://localhost:5000/delete-product/${index}`,
{
method:"DELETE"
}
);

loadProducts();

}

// Start

loadOrders();
loadProducts();

</script>

</body>
</html>
